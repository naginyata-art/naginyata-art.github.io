<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naginyata | Illustrator / Artist</title>
<meta name="description" content="Artwork portfolio of Naginyata, illustrator and artist.">
<meta name="theme-color" content="#2f2a3a">
<link rel="stylesheet" href="style.css">
</head>
<body class="lock">

<div id="intro" role="dialog" aria-label="Opening">
  <div>
    <div class="i-title" id="iTitle"></div>
    <p id="iSub"></p>
    <button class="start" id="start" type="button">Start &#9654;</button>
    <small>click to start</small>
  </div>
</div>

<header>
  <div class="wrap">
    <a class="logo" href="#home" id="logo"></a>
  </div>
</header>

<main>
  <!-- Home: 3 buttons + slogan -->
  <section class="screen" id="home">
    <div class="wrap home-in">
      <nav class="menu" id="menu" aria-label="Main menu"></nav>
      <div class="slogan">
        <h1 id="slogan"></h1>
        <div class="bar"></div>
        <p id="small"></p>
      </div>
    </div>
  </section>

  <!-- My Work -->
  <section class="screen" id="work">
    <div class="wrap">
      <a class="back" href="#home">&larr; Home</a>
      <h2>My Work</h2>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- About Me -->
  <section class="screen" id="about">
    <div class="wrap">
      <a class="back" href="#home">&larr; Home</a>
      <h2>About Me</h2>
      <div class="card about">
        <div id="aboutText"></div>
        <div class="avatar big" id="avatar"></div>
      </div>
      <div class="lboxes" id="aLinks"></div>
    </div>
  </section>

  <!-- Work With Me (form) -->
  <section class="screen" id="contact">
    <div class="wrap">
      <a class="back" href="#home">&larr; Home</a>
      <h2>Work With Me</h2>
      <div class="card">
        <form id="form">
          <div><label for="fn">NAME</label><input id="fn" required></div>
          <div><label for="fe">EMAIL</label><input id="fe" type="email" required></div>
          <div><label for="fm">MESSAGE</label><textarea id="fm" required></textarea></div>
          <div><button class="btn" type="submit" style="margin-top:0">Send</button></div>
          <div class="note" id="note"></div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> <span id="foot"></span>. All artwork rights reserved by the artist.</div>
</footer>

<div id="lb"><div class="box" id="lbBox"></div></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
