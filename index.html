<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naginyata | Illustrator / Artist</title>
<meta name="description" content="Artwork portfolio of Naginyata, illustrator and artist.">
<meta name="theme-color" content="#2f2a3a">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=20261016g">
</head>
<body class="lock">

<div id="intro" role="dialog" aria-label="Opening">
  <div>
    <div class="i-title" id="iTitle"></div>
    <p id="iSub"></p>
    <button class="start" id="start" type="button">Start &#9654;</button>
    <small>click to start</small>
  </div>
</div>

<header>
  <div class="wrap">
    <a class="logo" href="#home" id="logo"></a>
  </div>
</header>

<main>
  <!-- 1. Main: menu (left) + slogan (right) -->
  <section class="screen" id="home">
    <div class="wrap home-in">
      <nav class="menu" id="menu" aria-label="Main menu"></nav>
      <div class="slogan">
        <h1 id="slogan"></h1>
        <div class="bar"></div>
        <p id="small"></p>
      </div>
    </div>
  </section>

  <!-- 2. My work -->
  <section class="screen" id="work" aria-labelledby="hWork">
    <div class="wrap">
      <a class="back" href="#home">&larr; Home</a>
      <h2 id="hWork">My work</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter works"></div>
      <div class="grid" id="grid"></div>
      <div class="embeds" id="embeds" hidden></div>
    </div>
  </section>

  <!-- 3. Work with me (form) -->
  <section class="screen" id="contact" aria-labelledby="hContact">
    <div class="wrap">
      <a class="back" href="#home">&larr; Home</a>
      <h2 id="hContact">Work with me</h2>
      <div class="card">
        <form id="form" novalidate>
          <div class="f"><label for="fn">NAME <i>*</i></label><input id="fn" autocomplete="name" required><div class="err" id="en"></div></div>
          <div class="f"><label for="fe">EMAIL <i>*</i></label><input id="fe" type="email" autocomplete="email" required><div class="err" id="ee"></div></div>
          <div class="f"><label for="ft">TYPE OF REQUEST <i>*</i></label><select id="ft" required></select><div class="err" id="et"></div></div>
          <div class="f"><label for="fm">MESSAGE <i>*</i></label><textarea id="fm" required></textarea><div class="err" id="em"></div></div>
          <div><button class="btn" type="submit" style="margin-top:0">Send</button></div>
          <div class="note" id="note" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </section>

  <!-- 4. About me -->
  <section class="screen" id="about" aria-labelledby="hAbout">
    <div class="wrap">
      <a class="back" href="#home">&larr; Home</a>
      <h2 id="hAbout">About me</h2>
      <div class="card about">
        <div id="aboutText"></div>
        <div class="avatar big" id="avatar"></div>
      </div>
      <div class="lboxes" id="aLinks" aria-label="Links"></div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">© <span id="year"></span> <span id="foot"></span>. All artwork rights reserved by the artist.</div>
</footer>

<div id="lb"><div class="box" id="lbBox"></div></div>

<script src="data.js?v=20261016g"></script>
<script src="app.js?v=20261016g"></script>
</body>
</html>
