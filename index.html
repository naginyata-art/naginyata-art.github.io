<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naginyata | Illustrator / Artist</title>
<meta name="description" content="Artwork portfolio of Naginyata, illustrator and artist.">
<meta name="theme-color" content="#2f2a3a">
<link rel="stylesheet" href="style.css">
</head>
<body class="lock">

<div id="intro" role="dialog" aria-label="Opening">
  <div>
    <div class="i-title" id="iTitle"></div>
    <p id="iSub"></p>
    <button class="start" id="start" type="button">Start &#9654;</button>
    <small>click to start</small>
  </div>
</div>

<header>
  <div class="wrap">
    <a class="logo" href="#home" id="logo"></a>
    <nav class="top">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section id="home" class="home">
    <div class="wrap">
      <nav class="menu" id="menu" aria-label="Main menu"></nav>
      <div class="slogan">
        <div class="role" id="role"></div>
        <h1 id="slogan"></h1>
        <div class="bar"></div>
        <p id="small"></p>
        <div class="who"><div class="avatar" id="avatarHome"></div><span id="handle"></span></div>
      </div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <h2>My Work</h2>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="other">
    <div class="wrap">
      <h2>Other Work</h2>
      <div class="grid" id="gridOther"></div>
    </div>
  </section>

  <section id="socials">
    <div class="wrap">
      <h2>Socials</h2>
      <div class="card links" id="links"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <h2>About Me</h2>
      <div class="card">
        <div class="about">
          <div id="aboutText"></div>
          <div class="avatar big" id="avatar"></div>
        </div>
        <div class="alinks" id="aLinks"></div>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2>Work With Me</h2>
      <div class="card">
        <form id="form">
          <div><label for="fn">NAME</label><input id="fn" required></div>
          <div><label for="fe">EMAIL</label><input id="fe" type="email" required></div>
          <div><label for="fm">MESSAGE</label><textarea id="fm" required></textarea></div>
          <div><button class="btn" type="submit" style="margin-top:0">Send</button></div>
          <div class="note" id="note"></div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="flinks" id="fLinks"></div>
    <div>© <span id="year"></span> <span id="foot"></span>. All artwork rights reserved by the artist.</div>
  </div>
</footer>

<div id="lb"><div class="box" id="lbBox"></div></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
